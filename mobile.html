<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Морской бой Онлайн</title>
    <style>
        * {
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            user-select: none;
            box-sizing: border-box;
        }
        html, body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            width: 100%;
            height: 100%;
            position: fixed;
            font-family: -apple-system, BlinkMacSystemFont, 'Arial', sans-serif;
            background: #000;
            touch-action: none;
        }
        canvas {
            display: block;
            touch-action: none;
        }
        #ui-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            color: white;
            text-shadow: 1px 1px 3px black;
            z-index: 10;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }
        .menu-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #001428 0%, #002a4a 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
            transition: opacity 0.4s;
            z-index: 20;
            padding: 20px;
            overflow-y: auto;
        }
        .menu-screen.hidden {
            opacity: 0;
            pointer-events: none;
            display: none;
        }
        .auth-box, .map-select {
            background: rgba(10, 30, 50, 0.95);
            padding: 25px 20px;
            border-radius: 15px;
            border: 2px solid #4a8bb9;
            box-shadow: 0 0 30px rgba(74, 139, 185, 0.5);
            text-align: center;
            width: 100%;
            max-width: 380px;
        }
        h1, h2 {
            color: #aad4ff;
            margin: 0 0 10px;
            letter-spacing: 2px;
            font-size: 22px;
        }
        h1 { font-size: 20px; }
        p { margin: 8px 0; }
        input {
            display: block;
            width: 100%;
            padding: 14px;
            margin: 10px 0;
            border-radius: 8px;
            border: 1px solid #2a5a7a;
            background: #1a2f3f;
            color: white;
            font-size: 16px;
            box-sizing: border-box;
            -webkit-appearance: none;
        }
        button {
            background: #1e5a8a;
            color: white;
            border: none;
            padding: 14px 22px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin: 8px 4px;
            transition: 0.2s;
            border-bottom: 4px solid #0e3a5a;
            letter-spacing: 1px;
            pointer-events: auto;
            -webkit-appearance: none;
            touch-action: manipulation;
            min-width: 120px;
        }
        button:active {
            background: #2e7ab0;
            transform: scale(0.97);
            border-bottom-width: 2px;
        }
        button:disabled {
            background: #444;
            border-bottom-color: #222;
            opacity: 0.5;
        }
        .map-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin: 15px 0;
        }
        .map-card {
            background: #1a3f5a;
            border-radius: 10px;
            padding: 12px 8px;
            cursor: pointer;
            border: 2px solid #2e6a92;
            transition: 0.2s;
            pointer-events: auto;
            touch-action: manipulation;
        }
        .map-card:active {
            background: #2a5f7a;
            transform: scale(0.97);
        }
        .map-card.selected {
            border-color: #ffd966;
            background: #2a5f7a;
            box-shadow: 0 0 15px #ffd966;
        }
        .map-card h3 {
            margin: 0 0 4px;
            color: #fff;
            font-size: 13px;
        }
        .map-card p {
            margin: 0;
            font-size: 10px;
            color: #b0d4f0;
        }
        
        /* HUD - адаптивный */
        .hud {
            display: flex;
            justify-content: space-between;
            padding: 10px;
            padding-top: calc(10px + env(safe-area-inset-top));
            gap: 8px;
        }
        .hud-left, .hud-right {
            background: rgba(0, 20, 40, 0.75);
            padding: 8px 14px;
            border-radius: 30px;
            border: 1px solid #3a7a9a;
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            font-size: 12px;
            flex: 1;
            max-width: 45%;
        }
        .health-bar {
            width: 100%;
            height: 10px;
            background: #2a1a1a;
            border-radius: 5px;
            overflow: hidden;
            margin-top: 4px;
        }
        .health-fill {
            height: 100%;
            background: #3aff3a;
            width: 100%;
            transition: width 0.3s;
        }
        .score {
            color: #ffd966;
            font-weight: bold;
        }
        
        /* Мобильные контролы */
        #mobileControls {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 15;
            display: none;
        }
        #mobileControls.active {
            display: block;
        }
        .joystick-zone {
            position: absolute;
            bottom: calc(20px + env(safe-area-inset-bottom));
            left: 20px;
            width: 130px;
            height: 130px;
            border-radius: 50%;
            background: rgba(30, 90, 140, 0.25);
            border: 2px solid rgba(120, 180, 220, 0.5);
            pointer-events: auto;
            touch-action: none;
        }
        .joystick-knob {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 55px;
            height: 55px;
            margin-top: -27.5px;
            margin-left: -27.5px;
            border-radius: 50%;
            background: radial-gradient(circle, #6ab0e0, #1e5a8a);
            border: 2px solid #aad4ff;
            pointer-events: none;
            box-shadow: 0 0 15px rgba(100, 180, 255, 0.6);
        }
        .fire-button {
            position: absolute;
            bottom: calc(30px + env(safe-area-inset-bottom));
            right: 25px;
            width: 95px;
            height: 95px;
            border-radius: 50%;
            background: radial-gradient(circle, #ff6633, #992200);
            border: 3px solid #ffcc88;
            color: white;
            font-weight: bold;
            font-size: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
            touch-action: manipulation;
            box-shadow: 0 0 25px rgba(255, 100, 50, 0.7);
            text-shadow: 1px 1px 2px black;
            letter-spacing: 1px;
        }
        .fire-button:active {
            transform: scale(0.93);
            box-shadow: 0 0 40px rgba(255, 150, 50, 0.9);
        }
        
        .controls-hint {
            position: absolute;
            bottom: calc(10px + env(safe-area-inset-bottom));
            left: 50%;
            transform: translateX(-50%);
            padding: 6px 14px;
            font-size: 11px;
            color: #b0d4f0;
            background: rgba(0, 0, 0, 0.55);
            border-radius: 20px;
            white-space: nowrap;
            pointer-events: none;
        }
        
        /* Планшет и большие экраны */
        @media (min-width: 768px) {
            h1 { font-size: 26px; }
            .auth-box, .map-select { padding: 35px 40px; max-width: 450px; }
            .map-card h3 { font-size: 15px; }
            .map-card p { font-size: 12px; }
            .hud-left, .hud-right { font-size: 14px; padding: 10px 18px; }
            #mobileControls { display: none !important; }
        }
        
        /* Альбомная ориентация на телефоне */
        @media (max-height: 500px) and (orientation: landscape) {
            .auth-box, .map-select { padding: 15px 20px; max-height: 95vh; overflow-y: auto; }
            h1 { font-size: 16px; }
            .map-grid { grid-template-columns: repeat(4, 1fr); }
            .map-card h3 { font-size: 11px; }
            .map-card p { display: none; }
            button { padding: 10px 16px; font-size: 14px; }
            input { padding: 10px; font-size: 14px; }
        }
        
        /* Скрываем подсказки клавиатуры на мобильных */
        @media (hover: none) and (pointer: coarse) {
            .desktop-hint { display: none; }
        }
        
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #aad4ff;
            font-size: 16px;
            text-align: center;
            z-index: 30;
        }
    </style>
</head>
<body>
    <div id="ui-container"></div>
    
    <!-- Мобильные контролы -->
    <div id="mobileControls">
        <div class="joystick-zone" id="joystickZone">
            <div class="joystick-knob" id="joystickKnob"></div>
        </div>
        <div class="fire-button" id="fireButton">ОГОНЬ</div>
        <div class="controls-hint" id="mobileHint">Джойстик — движение | Огонь — выстрел</div>
    </div>

    <!-- Экран входа/регистрации -->
    <div id="authScreen" class="menu-screen">
        <div class="auth-box">
            <h1>⚓ Морской бой Онлайн ⚓</h1>
            <p style="color:#b0d4f0; font-size:13px;">Морской бой</p>
            <input type="text" id="username" placeholder="Имя капитана" value="Адмирал" autocomplete="off">
            <input type="password" id="password" placeholder="Пароль" value="12345">
            <div>
                <button id="loginBtn">Войти</button>
                <button id="registerBtn">Регистрация</button>
            </div>
            <p style="font-size:11px; margin-top:15px; color:#7a9ab0;">* любой логин/пароль для прототипа</p>
        </div>
    </div>

    <!-- Экран выбора карты -->
    <div id="mapScreen" class="menu-screen hidden">
        <div class="map-select">
            <h2>ВЫБОР КАРТЫ</h2>
            <div class="map-grid" id="mapGrid"></div>
            <button id="startBattleBtn" disabled>В БОЙ!</button>
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.126.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.126.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

        // ---------- ОПРЕДЕЛЕНИЕ МОБИЛЬНОГО УСТРОЙСТВА ----------
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) 
                        || ('ontouchstart' in window && window.innerWidth < 1024);
        const isLowPower = isMobile || window.innerWidth < 768;
        
        // ---------- ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ ----------
        let scene, camera, renderer, labelRenderer;
        let playerShip, allies = [], enemies = [], bullets = [];
        let ocean, sky;
        let clock = new THREE.Clock();
        
        let gameActive = false;
        let playerHealth = 100;
        let score = 0;
        
        const keys = { w: false, a: false, s: false, d: false, space: false };
        let currentMap = 'north';
        
        // Джойстик
        const joystick = { active: false, x: 0, y: 0, touchId: null };
        let fireCooldown = 0;
        
        // Оптимизация: переиспользуемые векторы
        const _v1 = new THREE.Vector3();
        const _v2 = new THREE.Vector3();
        const _q1 = new THREE.Quaternion();

        // ---------- ИНИЦИАЛИЗАЦИЯ ----------
        function initScene() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB);
            // Туман только на мощных устройствах
            scene.fog = isLowPower ? null : new THREE.Fog(0x87CEEB, 150, 700);

            camera = new THREE.PerspectiveCamera(
                isMobile ? 70 : 60,
                window.innerWidth / window.innerHeight,
                0.5,
                isLowPower ? 900 : 2000
            );
            camera.position.set(0, 30, 80);

            // WebGL рендерер с оптимизациями
            renderer = new THREE.WebGLRenderer({ 
                antialias: !isLowPower,
                powerPreference: 'high-performance',
                stencil: false,
                depth: true
            });
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, isLowPower ? 1.5 : 2));
            renderer.setSize(window.innerWidth, window.innerHeight);
            // Тени только на мощных устройствах
            renderer.shadowMap.enabled = !isLowPower;
            if (renderer.shadowMap.enabled) {
                renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            }
            document.body.appendChild(renderer.domElement);

            // CSS2DRenderer для меток
            labelRenderer = new CSS2DRenderer();
            labelRenderer.setSize(window.innerWidth, window.innerHeight);
            labelRenderer.domElement.style.position = 'absolute';
            labelRenderer.domElement.style.top = '0px';
            labelRenderer.domElement.style.left = '0px';
            labelRenderer.domElement.style.pointerEvents = 'none';
            document.body.appendChild(labelRenderer.domElement);

            // Свет
            const ambientLight = new THREE.AmbientLight(0x6080a0, 0.9);
            scene.add(ambientLight);

            const sunLight = new THREE.DirectionalLight(0xffeedd, isLowPower ? 1.0 : 1.2);
            sunLight.position.set(100, 200, 50);
            if (!isLowPower) {
                sunLight.castShadow = true;
                sunLight.shadow.mapSize.width = 1024;
                sunLight.shadow.mapSize.height = 1024;
                const d = 250;
                sunLight.shadow.camera.left = -d;
                sunLight.shadow.camera.right = d;
                sunLight.shadow.camera.top = d;
                sunLight.shadow.camera.bottom = -d;
                sunLight.shadow.camera.near = 1;
                sunLight.shadow.camera.far = 500;
            }
            scene.add(sunLight);

            // Океан — уменьшаем сегменты для мобильных
            const segments = isLowPower ? 32 : 80;
            const oceanGeometry = new THREE.PlaneGeometry(2000, 2000, segments, segments);
            const oceanMaterial = new THREE.MeshStandardMaterial({
                color: 0x1a4a7a,
                emissive: 0x102a4a,
                roughness: 0.4,
                metalness: 0.1,
                side: THREE.DoubleSide
            });
            ocean = new THREE.Mesh(oceanGeometry, oceanMaterial);
            ocean.rotation.x = -Math.PI / 2;
            ocean.position.y = -1;
            ocean.receiveShadow = !isLowPower;
            scene.add(ocean);

            // Небо — упрощённое
            const skyGeo = new THREE.SphereGeometry(750, isLowPower ? 16 : 32, isLowPower ? 8 : 15);
            const skyMat = new THREE.MeshBasicMaterial({
                color: 0x87CEEB,
                side: THREE.BackSide
            });
            sky = new THREE.Mesh(skyGeo, skyMat);
            scene.add(sky);

            window.addEventListener('resize', onWindowResize);
            window.addEventListener('orientationchange', () => {
                setTimeout(onWindowResize, 200);
            });
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            labelRenderer.setSize(window.innerWidth, window.innerHeight);
        }

        // ---------- СОЗДАНИЕ КОРАБЛЯ (упрощённая геометрия для мобильных) ----------
        function createShip(color, size = 1, isPlayer = false) {
            const group = new THREE.Group();
            
            // Корпус — используем одну геометрию для всех (кэш)
            const hullMat = new THREE.MeshLambertMaterial({ color: color });
            const hullGeo = new THREE.BoxGeometry(4 * size, 1.5 * size, 10 * size);
            const hull = new THREE.Mesh(hullGeo, hullMat);
            hull.position.y = 0.5 * size;
            if (!isLowPower) { hull.castShadow = true; hull.receiveShadow = true; }
            group.add(hull);

            // Надстройка
            const superMat = new THREE.MeshLambertMaterial({ color: 0xdddddd });
            const superGeo = new THREE.BoxGeometry(2.5 * size, 1.2 * size, 3 * size);
            const superstructure = new THREE.Mesh(superGeo, superMat);
            superstructure.position.set(0, 1.5 * size, -1 * size);
            if (!isLowPower) superstructure.castShadow = true;
            group.add(superstructure);

            // Башня (упрощённая — цилиндр с 6 сегментами)
            const turretMat = new THREE.MeshLambertMaterial({ color: 0x888888 });
            const turretGeo = new THREE.CylinderGeometry(1 * size, 1.2 * size, 1 * size, 6);
            const turret = new THREE.Mesh(turretGeo, turretMat);
            turret.position.set(0, 2.2 * size, 2 * size);
            if (!isLowPower) turret.castShadow = true;
            group.add(turret);

            // Ствол
            const barrelMat = new THREE.MeshLambertMaterial({ color: 0x555555 });
            const barrelGeo = new THREE.CylinderGeometry(0.2 * size, 0.2 * size, 3 * size, 5);
            const barrel = new THREE.Mesh(barrelGeo, barrelMat);
            barrel.position.set(0, 2.2 * size, 3.5 * size);
            barrel.rotation.x = Math.PI / 2;
            group.add(barrel);

            // Метки только для игрока и если не супер-низкая производительность
            if (isPlayer && !isLowPower) {
                const div = document.createElement('div');
                div.textContent = '⚓';
                div.style.color = '#ffd966';
                div.style.fontSize = '20px';
                div.style.fontWeight = 'bold';
                div.style.textShadow = '1px 1px 3px black';
                const label = new CSS2DObject(div);
                label.position.set(0, 8 * size, 0);
                group.add(label);
            }

            return group;
        }

        // ---------- ОБЪЕКТЫ КАРТЫ ----------
        function addMapObjects(mapId) {
            const islandMat = new THREE.MeshLambertMaterial({ color: 0x3a6a3a });
            const islandMat2 = new THREE.MeshLambertMaterial({ color: 0x4a7a4a });
            const segmentCount = isLowPower ? 6 : 8;
            
            const islands = [];
            if (mapId === 'north') {
                islands.push({ pos: [-60, 2, -50], r1: 15, r2: 20, h: 8, mat: islandMat });
                islands.push({ pos: [70, 1, -30], r1: 12, r2: 15, h: 6, mat: islandMat2 });
            } else if (mapId === 'south') {
                islands.push({ pos: [50, 2, 60], r1: 18, r2: 22, h: 10, mat: islandMat });
                islands.push({ pos: [-70, 1, 40], r1: 10, r2: 12, h: 5, mat: islandMat2 });
            } else if (mapId === 'east') {
                islands.push({ pos: [80, 3, 0], r1: 20, r2: 25, h: 12, mat: islandMat });
                islands.push({ pos: [40, 2, -70], r1: 14, r2: 18, h: 7, mat: islandMat2 });
            } else if (mapId === 'west') {
                islands.push({ pos: [-80, 2, 20], r1: 16, r2: 20, h: 9, mat: islandMat });
                islands.push({ pos: [-40, 3, -60], r1: 22, r2: 28, h: 14, mat: islandMat2 });
            }
            
            islands.forEach(island => {
                const geo = new THREE.CylinderGeometry(island.r1, island.r2, island.h, segmentCount);
                const mesh = new THREE.Mesh(geo, island.mat);
                mesh.position.set(island.pos[0], island.pos[1], island.pos[2]);
                if (!isLowPower) { mesh.castShadow = true; mesh.receiveShadow = true; }
                scene.add(mesh);
            });
        }

        // ---------- СПАВН КОРАБЛЕЙ ----------
        function spawnShips() {
            allies.forEach(s => scene.remove(s));
            enemies.forEach(s => scene.remove(s));
            bullets.forEach(b => scene.remove(b));
            allies = [];
            enemies = [];
            bullets = [];

            if (playerShip) scene.remove(playerShip);
            playerShip = createShip(0x3a7ab0, 1.2, true);
            playerShip.position.set(0, 0, 0);
            scene.add(playerShip);

            // Союзники — на мобильных меньше
            const allyCount = isLowPower ? 1 : 2;
            for (let i = 0; i < allyCount; i++) {
                const ally = createShip(0x3a7ab0, 1.0, false);
                ally.position.set(-20 + i * 40, 0, 30);
                ally.rotation.y = Math.PI;
                scene.add(ally);
                allies.push(ally);
            }

            // Враги — на мобильных меньше
            const enemyCount = isLowPower ? 2 : 3;
            for (let i = 0; i < enemyCount; i++) {
                const enemy = createShip(0xb03a3a, 1.0, false);
                enemy.position.set(-30 + i * 35, 0, -70);
                scene.add(enemy);
                enemies.push(enemy);
            }
        }

        // ---------- АНИМАЦИЯ ВОДЫ (упрощённая) ----------
        function animateOcean(time) {
            if (!ocean || !ocean.geometry) return;
            const positions = ocean.geometry.attributes.position.array;
            const step = isLowPower ? 4 : 2; // реже обновляем
            for (let i = 0; i < positions.length; i += 3) {
                const x = positions[i];
                const y = positions[i + 1];
                positions[i + 2] = Math.sin(x * 0.05 + time * 1.5) * 1.2 + Math.cos(y * 0.03 + time * 1.0) * 0.9;
            }
            ocean.geometry.attributes.position.needsUpdate = true;
            if (!isLowPower) ocean.geometry.computeVertexNormals();
        }

        // ---------- ОБНОВЛЕНИЕ ИГРЫ ----------
        function updateGame(delta) {
            if (!gameActive || !playerShip) return;

            const dt = Math.min(delta, 0.05);
            const speed = 18 * dt;
            const rotSpeed = 1.6 * dt;

            // Управление с клавиатуры
            let moveX = 0, moveZ = 0;
            if (keys.w) moveZ += 1;
            if (keys.s) moveZ -= 0.6;
            if (keys.a) playerShip.rotation.y += rotSpeed;
            if (keys.d) playerShip.rotation.y -= rotSpeed;
            
            // Джойстик
            if (joystick.active) {
                moveZ += -joystick.y;
                playerShip.rotation.y -= joystick.x * rotSpeed * 1.5;
            }

            // Применяем движение
            if (moveZ !== 0) {
                playerShip.position.x += Math.sin(playerShip.rotation.y) * speed * moveZ;
                playerShip.position.z += Math.cos(playerShip.rotation.y) * speed * moveZ;
            }

            // Ограничения
            const limit = 180;
            if (playerShip.position.x > limit) playerShip.position.x = limit;
            if (playerShip.position.x < -limit) playerShip.position.x = -limit;
            if (playerShip.position.z > limit) playerShip.position.z = limit;
            if (playerShip.position.z < -limit) playerShip.position.z = -limit;

            // Камера
            _v1.set(0, 25, -50).applyQuaternion(playerShip.quaternion);
            _v2.copy(playerShip.position).add(_v1);
            camera.position.lerp(_v2, 0.08);
            
            _v1.set(0, 5, 30).applyQuaternion(playerShip.quaternion);
            _v2.copy(playerShip.position).add(_v1);
            camera.lookAt(_v2);

            // Враги — упрощённый ИИ
            for (let i = 0; i < enemies.length; i++) {
                const enemy = enemies[i];
                _v1.subVectors(playerShip.position, enemy.position);
                const dist = _v1.length();
                if (dist > 30) {
                    _v1.normalize();
                    enemy.position.x += _v1.x * 0.12;
                    enemy.position.z += _v1.z * 0.12;
                }
                enemy.rotation.y = Math.atan2(playerShip.position.x - enemy.position.x, playerShip.position.z - enemy.position.z);
                
                // Проверка столкновения
                if (dist < 12) {
                    playerHealth -= 0.3;
                    if (playerHealth < 0) playerHealth = 0;
                    updateHUD();
                    _v2.subVectors(playerShip.position, enemy.position).normalize();
                    playerShip.position.x += _v2.x * 1.5;
                    playerShip.position.z += _v2.z * 1.5;
                }
            }

            // Союзники — следует за игроком
            for (let i = 0; i < allies.length; i++) {
                const ally = allies[i];
                _v1.set(-20 + i * 40, 0, 25).applyQuaternion(playerShip.quaternion);
                _v2.copy(playerShip.position).add(_v1);
                ally.position.lerp(_v2, 0.03);
                ally.rotation.y = playerShip.rotation.y;
            }

            // Обновление пуль
            for (let i = bullets.length - 1; i >= 0; i--) {
                const bullet = bullets[i];
                bullet.position.addScaledVector(bullet.userData.velocity, dt);
                bullet.userData.life -= dt;
                
                // Проверка попадания во врагов
                let hit = false;
                for (let j = 0; j < enemies.length; j++) {
                    if (bullet.position.distanceTo(enemies[j].position) < 8) {
                        score += 10;
                        updateHUD();
                        // Визуальный эффект
                        const explosion = new THREE.Mesh(
                            new THREE.SphereGeometry(4, 6, 6),
                            new THREE.MeshBasicMaterial({ color: 0xff6600 })
                        );
                        explosion.position.copy(enemies[j].position);
                        scene.add(explosion);
                        setTimeout(() => scene.remove(explosion), 250);
                        hit = true;
                        break;
                    }
                }
                
                if (hit || bullet.userData.life <= 0) {
                    scene.remove(bullet);
                    bullet.geometry.dispose();
                    bullet.material.dispose();
                    bullets.splice(i, 1);
                }
            }

            // Стрельба
            fireCooldown -= dt;
            if ((keys.space || joystick.fire) && fireCooldown <= 0) {
                shoot();
                keys.space = false;
                joystick.fire = false;
                fireCooldown = 0.35;
            }

            if (playerHealth <= 0) {
                gameActive = false;
                setTimeout(() => {
                    alert('Корабль потоплен!');
                    location.reload();
                }, 100);
            }
        }

        function shoot() {
            const bulletGeo = new THREE.SphereGeometry(0.8, 5, 5);
            const bulletMat = new THREE.MeshBasicMaterial({ color: 0xffaa00 });
            const bullet = new THREE.Mesh(bulletGeo, bulletMat);
            
            _v1.set(0, 5, 10).applyQuaternion(playerShip.quaternion);
            bullet.position.copy(playerShip.position).add(_v1);
            
            _v1.set(0, 0, 1).applyQuaternion(playerShip.quaternion);
            bullet.userData.velocity = _v1.clone().multiplyScalar(60);
            bullet.userData.life = 2;
            
            scene.add(bullet);
            bullets.push(bullet);
        }

        // ---------- HUD ----------
        function updateHUD() {
            const hud = document.getElementById('ui-container');
            const hintText = isMobile ? 'Джойстик — движение' : 'W/S — ход | A/D — руль | ПРОБЕЛ — огонь';
            
            hud.innerHTML = `
                <div class="hud">
                    <div class="hud-left">
                        <div>❤️ ${Math.round(playerHealth)}%</div>
                        <div class="health-bar"><div class="health-fill" style="width:${playerHealth}%"></div></div>
                    </div>
                    <div class="hud-right">
                        <div>🎯 <span class="score">${score}</span></div>
                        <div style="font-size:11px;">💀 ${enemies.length} | ⚓ ${allies.length}</div>
                    </div>
                </div>
                <div class="controls-hint desktop-hint">${hintText}</div>
            `;
        }

        // ---------- ЗАПУСК ИГРЫ ----------
        function startGame(mapId) {
            while(scene.children.length > 0) {
                const obj = scene.children[0];
                if (obj.geometry) obj.geometry.dispose();
                if (obj.material) {
                    if (Array.isArray(obj.material)) obj.material.forEach(m => m.dispose());
                    else obj.material.dispose();
                }
                scene.remove(obj);
            }
            
            initScene();
            addMapObjects(mapId);
            spawnShips();
            
            playerHealth = 100;
            score = 0;
            gameActive = true;
            
            updateHUD();
            
            document.getElementById('authScreen').classList.add('hidden');
            document.getElementById('mapScreen').classList.add('hidden');
            
            // Активируем мобильные контролы
            if (isMobile) {
                document.getElementById('mobileControls').classList.add('active');
            }
        }

        // ---------- МОБИЛЬНЫЕ КОНТРОЛЫ ----------
        function setupMobileControls() {
            const joystickZone = document.getElementById('joystickZone');
            const joystickKnob = document.getElementById('joystickKnob');
            const fireButton = document.getElementById('fireButton');
            
            const maxDistance = 40;
            
            function handleJoystickStart(e) {
                e.preventDefault();
                const touch = e.changedTouches[0];
                joystick.touchId = touch.identifier;
                joystick.active = true;
                updateJoystick(touch);
            }
            
            function handleJoystickMove(e) {
                e.preventDefault();
                if (!joystick.active) return;
                for (let i = 0; i < e.changedTouches.length; i++) {
                    const touch = e.changedTouches[i];
                    if (touch.identifier === joystick.touchId) {
                        updateJoystick(touch);
                        break;
                    }
                }
            }
            
            function updateJoystick(touch) {
                const rect = joystickZone.getBoundingClientRect();
                const centerX = rect.left + rect.width / 2;
                const centerY = rect.top + rect.height / 2;
                let dx = touch.clientX - centerX;
                let dy = touch.clientY - centerY;
                const dist = Math.sqrt(dx * dx + dy * dy);
                
                if (dist > maxDistance) {
                    dx = (dx / dist) * maxDistance;
                    dy = (dy / dist) * maxDistance;
                }
                
                joystickKnob.style.transform = `translate(${dx}px, ${dy}px)`;
                joystick.x = dx / maxDistance;
                joystick.y = dy / maxDistance;
            }
            
            function handleJoystickEnd(e) {
                e.preventDefault();
                for (let i = 0; i < e.changedTouches.length; i++) {
                    if (e.changedTouches[i].identifier === joystick.touchId) {
                        joystick.active = false;
                        joystick.x = 0;
                        joystick.y = 0;
                        joystick.touchId = null;
                        joystickKnob.style.transform = 'translate(0, 0)';
                        break;
                    }
                }
            }
            
            joystickZone.addEventListener('touchstart', handleJoystickStart, { passive: false });
            joystickZone.addEventListener('touchmove', handleJoystickMove, { passive: false });
            joystickZone.addEventListener('touchend', handleJoystickEnd, { passive: false });
            joystickZone.addEventListener('touchcancel', handleJoystickEnd, { passive: false });
            
            // Огонь
            fireButton.addEventListener('touchstart', (e) => {
                e.preventDefault();
                joystick.fire = true;
            }, { passive: false });
        }

        // ---------- ОБРАБОТЧИКИ ----------
        function setupEventListeners() {
            window.addEventListener('keydown', (e) => {
                switch(e.code) {
                    case 'KeyW': case 'ArrowUp': keys.w = true; e.preventDefault(); break;
                    case 'KeyA': case 'ArrowLeft': keys.a = true; e.preventDefault(); break;
                    case 'KeyS': case 'ArrowDown': keys.s = true; e.preventDefault(); break;
                    case 'KeyD': case 'ArrowRight': keys.d = true; e.preventDefault(); break;
                    case 'Space': if (gameActive) { keys.space = true; e.preventDefault(); } break;
                }
            });
            
            window.addEventListener('keyup', (e) => {
                switch(e.code) {
                    case 'KeyW': case 'ArrowUp': keys.w = false; break;
                    case 'KeyA': case 'ArrowLeft': keys.a = false; break;
                    case 'KeyS': case 'ArrowDown': keys.s = false; break;
                    case 'KeyD': case 'ArrowRight': keys.d = false; break;
                }
            });

            // Авторизация
            document.getElementById('loginBtn').addEventListener('click', () => {
                const u = document.getElementById('username').value.trim() || 'Адмирал';
                console.log('Вход:', u);
                document.getElementById('authScreen').classList.add('hidden');
                document.getElementById('mapScreen').classList.remove('hidden');
            });
            
            document.getElementById('registerBtn').addEventListener('click', () => {
                alert('Регистрация успешна!');
            });
            
            // Карты
            const mapGrid = document.getElementById('mapGrid');
            const maps = [
                { id: 'north', name: 'Север', desc: 'Ледяные воды' },
                { id: 'south', name: 'Юг', desc: 'Тёплое море' },
                { id: 'east', name: 'Восток', desc: 'Опасные рифы' },
                { id: 'west', name: 'Запад', desc: 'Туманные берега' }
            ];
            
            maps.forEach(map => {
                const card = document.createElement('div');
                card.className = 'map-card';
                card.dataset.mapId = map.id;
                card.innerHTML = `<h3>${map.name}</h3><p>${map.desc}</p>`;
                card.addEventListener('click', () => {
                    document.querySelectorAll('.map-card').forEach(c => c.classList.remove('selected'));
                    card.classList.add('selected');
                    document.getElementById('startBattleBtn').disabled = false;
                    currentMap = map.id;
                });
                // Touch-событие для мобильных
                card.addEventListener('touchend', (e) => {
                    e.preventDefault();
                    document.querySelectorAll('.map-card').forEach(c => c.classList.remove('selected'));
                    card.classList.add('selected');
                    document.getElementById('startBattleBtn').disabled = false;
                    currentMap = map.id;
                }, { passive: false });
                mapGrid.appendChild(card);
            });
            
            document.getElementById('startBattleBtn').addEventListener('click', () => {
                startGame(currentMap);
            });
            
            // Предотвращаем скролл
            document.addEventListener('touchmove', (e) => {
                if (gameActive) e.preventDefault();
            }, { passive: false });
        }

        // ---------- ГЛАВНЫЙ ЦИКЛ ----------
        let lastTime = 0;
        let frameCount = 0;
        
        function animate() {
            requestAnimationFrame(animate);
            
            const delta = clock.getDelta();
            const now = performance.now();
            
            // Ограничиваем FPS на слабых устройствах
            if (isLowPower && now - lastTime < 30) return;
            lastTime = now;
            
            const elapsed = now / 1000;
            frameCount++;
            
            // Анимация воды — обновляем реже
            if (!isLowPower || frameCount % 2 === 0) {
                animateOcean(elapsed);
            }
            
            if (gameActive) {
                updateGame(delta);
            } else if (playerShip) {
                _v1.set(0, 25, -50).applyQuaternion(playerShip.quaternion);
                _v2.copy(playerShip.position).add(_v1);
                camera.position.lerp(_v2, 0.05);
                camera.lookAt(playerShip.position);
            }
            
            renderer.render(scene, camera);
            labelRenderer.render(scene, camera);
        }

        // ---------- СТАРТ ----------
        window.onload = () => {
            initScene();
            setupEventListeners();
            if (isMobile) setupMobileControls();
            
            // Авто-вход для отладки (закомментировать для продакшена)
            // setTimeout(() => {
            //     document.getElementById('authScreen').classList.add('hidden');
            //     document.getElementById('mapScreen').classList.remove('hidden');
            // }, 500);
            
            document.getElementById('ui-container').innerHTML = '';
            animate();
        };
    </script>
