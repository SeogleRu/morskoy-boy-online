<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Морской бой Онлайн</title>
    <style>
        * { -webkit-tap-highlight-color: transparent; user-select: none; box-sizing: border-box; }
        html, body {
            margin: 0; padding: 0; overflow: hidden;
            width: 100%; height: 100%; position: fixed;
            font-family: -apple-system, BlinkMacSystemFont, 'Arial', sans-serif;
            background: #000; touch-action: none;
        }
        canvas { display: block; touch-action: none; }
        #ui-container {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%; pointer-events: none;
            color: white; text-shadow: 1px 1px 3px black; z-index: 10;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }
        .menu-screen {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            background: linear-gradient(135deg, #001428 0%, #002a4a 100%);
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            pointer-events: auto;
            z-index: 20; padding: 20px; overflow-y: auto;
        }
        .menu-screen.hidden {
            display: none !important;
        }
        .auth-box, .map-select {
            background: rgba(10, 30, 50, 0.95);
            padding: 25px 20px; border-radius: 15px;
            border: 2px solid #4a8bb9;
            box-shadow: 0 0 30px rgba(74, 139, 185, 0.5);
            text-align: center; width: 100%; max-width: 380px;
            pointer-events: auto;
        }
        h1, h2 { color: #aad4ff; margin: 0 0 10px; letter-spacing: 2px; }
        h1 { font-size: 20px; }
        p { margin: 8px 0; }
        input {
            display: block; width: 100%; padding: 14px;
            margin: 10px 0; border-radius: 8px;
            border: 1px solid #2a5a7a; background: #1a2f3f;
            color: white; font-size: 16px; -webkit-appearance: none;
            pointer-events: auto;
        }
        button {
            background: #1e5a8a; color: white; border: none;
            padding: 14px 22px; border-radius: 30px;
            font-size: 16px; font-weight: bold; cursor: pointer;
            margin: 8px 4px; transition: 0.2s;
            border-bottom: 4px solid #0e3a5a;
            letter-spacing: 1px; pointer-events: auto;
            -webkit-appearance: none; touch-action: manipulation;
            min-width: 120px;
            position: relative;
            z-index: 25;
        }
        button:hover:not(:disabled) { background: #2e7ab0; }
        button:active:not(:disabled) { transform: scale(0.97); }
        button:disabled { background: #444; border-bottom-color: #222; opacity: 0.5; cursor: not-allowed; }
        .map-grid {
            display: grid; grid-template-columns: 1fr 1fr;
            gap: 10px; margin: 15px 0;
        }
        .map-card {
            background: #1a3f5a; border-radius: 10px;
            padding: 12px 8px; cursor: pointer;
            border: 2px solid #2e6a92;
            transition: 0.2s; pointer-events: auto;
            touch-action: manipulation;
            position: relative;
            z-index: 25;
        }
        .map-card:hover { background: #2a5f7a; }
        .map-card:active { background: #2a5f7a; transform: scale(0.97); }
        .map-card.selected {
            border-color: #ffd966; background: #2a5f7a;
            box-shadow: 0 0 15px #ffd966;
        }
        .map-card h3 { margin: 0 0 4px; color: #fff; font-size: 13px; }
        .map-card p { margin: 0; font-size: 10px; color: #b0d4f0; }

        /* HUD */
        .hud {
            display: flex; justify-content: space-between;
            padding: 10px; padding-top: calc(10px + env(safe-area-inset-top));
            gap: 8px;
        }
        .hud-left, .hud-right {
            background: rgba(0, 20, 40, 0.75);
            padding: 8px 14px; border-radius: 30px;
            border: 1px solid #3a7a9a;
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            font-size: 12px; flex: 1; max-width: 45%;
        }
        .health-bar {
            width: 100%; height: 10px; background: #2a1a1a;
            border-radius: 5px; overflow: hidden; margin-top: 4px;
        }
        .health-fill {
            height: 100%; background: #3aff3a;
            width: 100%; transition: width 0.3s;
        }
        .score { color: #ffd966; font-weight: bold; }

        /* Экран победы */
        #victoryScreen {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: radial-gradient(circle, rgba(0,80,40,0.95), rgba(0,20,10,0.98));
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            pointer-events: auto;
            color: white;
            padding: 20px;
        }
        #victoryScreen.show {
            display: flex;
        }
        #victoryScreen h1 {
            font-size: 60px;
            color: #ffd966;
            text-shadow: 0 0 30px #ffd966, 3px 3px 8px black;
            margin: 0;
            letter-spacing: 8px;
            animation: pulse 1.2s infinite alternate;
        }
        #victoryScreen p {
            font-size: 20px;
            color: #aad4ff;
            margin: 20px 0;
            text-align: center;
        }
        @keyframes pulse {
            from { transform: scale(1); }
            to { transform: scale(1.08); }
        }

        /* Мобильные контролы */
        #mobileControls {
            position: absolute; bottom: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none; z-index: 15; display: none;
        }
        #mobileControls.active { display: block; }
        .joystick-zone {
            position: absolute;
            bottom: calc(20px + env(safe-area-inset-bottom));
            left: 20px; width: 130px; height: 130px;
            border-radius: 50%;
            background: rgba(30, 90, 140, 0.25);
            border: 2px solid rgba(120, 180, 220, 0.5);
            pointer-events: auto; touch-action: none;
        }
        .joystick-knob {
            position: absolute; top: 50%; left: 50%;
            width: 55px; height: 55px;
            margin-top: -27.5px; margin-left: -27.5px;
            border-radius: 50%;
            background: radial-gradient(circle, #6ab0e0, #1e5a8a);
            border: 2px solid #aad4ff;
            pointer-events: none;
            box-shadow: 0 0 15px rgba(100, 180, 255, 0.6);
        }
        .fire-button {
            position: absolute;
            bottom: calc(30px + env(safe-area-inset-bottom));
            right: 25px; width: 95px; height: 95px;
            border-radius: 50%;
            background: radial-gradient(circle, #ff6633, #992200);
            border: 3px solid #ffcc88;
            color: white; font-weight: bold; font-size: 13px;
            display: flex; align-items: center; justify-content: center;
            pointer-events: auto; touch-action: manipulation;
            box-shadow: 0 0 25px rgba(255, 100, 50, 0.7);
            text-shadow: 1px 1px 2px black; letter-spacing: 1px;
        }
        .fire-button:active { transform: scale(0.93); }
        .controls-hint {
            position: absolute;
            bottom: calc(10px + env(safe-area-inset-bottom));
            left: 50%; transform: translateX(-50%);
            padding: 6px 14px; font-size: 11px; color: #b0d4f0;
            background: rgba(0, 0, 0, 0.55); border-radius: 20px;
            white-space: nowrap; pointer-events: none;
        }
        @media (min-width: 768px) {
            h1 { font-size: 26px; }
            .auth-box, .map-select { padding: 35px 40px; max-width: 450px; }
            .map-card h3 { font-size: 15px; }
            .map-card p { font-size: 12px; }
            .hud-left, .hud-right { font-size: 14px; padding: 10px 18px; }
            #mobileControls { display: none !important; }
            #victoryScreen h1 { font-size: 90px; }
        }
        @media (max-height: 500px) and (orientation: landscape) {
            .auth-box, .map-select { padding: 15px 20px; max-height: 95vh; overflow-y: auto; }
            h1 { font-size: 16px; }
            .map-grid { grid-template-columns: repeat(4, 1fr); }
            .map-card h3 { font-size: 11px; }
            .map-card p { display: none; }
            button { padding: 10px 16px; font-size: 14px; }
            input { padding: 10px; font-size: 14px; }
            #victoryScreen h1 { font-size: 40px; letter-spacing: 4px; }
        }
        @media (hover: none) and (pointer: coarse) {
            .desktop-hint { display: none; }
        }
    </style>
</head>
<body>
    <div id="ui-container"></div>

    <!-- Экран победы -->
    <div id="victoryScreen">
        <h1>ПОБЕДА!</h1>
        <p>Вражеский флот уничтожен</p>
        <p style="font-size:16px; color:#ffd966;">Очки: <span id="victoryScore">0</span></p>
        <button id="backToMenuBtn" style="margin-top:20px; background:#2e8a4a; border-bottom-color:#0e5a2a; font-size:18px; padding:16px 40px;">К ВЫБОРУ КАРТЫ</button>
    </div>

    <!-- Мобильные контролы -->
    <div id="mobileControls">
        <div class="joystick-zone" id="joystickZone">
            <div class="joystick-knob" id="joystickKnob"></div>
        </div>
        <div class="fire-button" id="fireButton">ОГОНЬ</div>
        <div class="controls-hint desktop-hint" id="mobileHint">Джойстик — движение | ОГОНЬ — выстрел</div>
    </div>

    <div id="authScreen" class="menu-screen">
        <div class="auth-box">
            <h1>⚓ Морской бой Онлайн ⚓</h1>
            <p style="color:#b0d4f0; font-size:13px;">Морской бой в браузере</p>
            <input type="text" id="username" placeholder="Имя капитана" value="Адмирал" autocomplete="off">
            <input type="password" id="password" placeholder="Пароль" value="12345">
            <div>
                <button id="loginBtn">Войти</button>
                <button id="registerBtn">Регистрация</button>
            </div>
            <p style="font-size:11px; margin-top:15px; color:#7a9ab0;">* любой логин/пароль</p>
        </div>
    </div>

    <div id="mapScreen" class="menu-screen hidden">
        <div class="map-select">
            <h2>ВЫБОР КАРТЫ</h2>
            <div class="map-grid" id="mapGrid"></div>
            <button id="startBattleBtn" disabled>В БОЙ!</button>
            <p id="mapStatus" style="font-size:12px; color:#7a9ab0; margin-top:10px;">Выберите карту</p>
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.126.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.126.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent)
                        || ('ontouchstart' in window && window.innerWidth < 1024);
        const isLowPower = isMobile || window.innerWidth < 768;

        let scene, camera, renderer, labelRenderer;
        let playerShip, allies = [], enemies = [], bullets = [], enemyBullets = [];
        let ocean, sky;
        const clock = new THREE.Clock();

        let gameActive = false;
        let playerHealth = 100;
        let score = 0;
        let worldInitialized = false;
        let victoryShown = false;
        let selectedMapId = null;

        const HITS_TO_KILL = 3;

        const keys = { w: false, a: false, s: false, d: false, space: false };
        let currentMap = 'north';
        let currentUsername = 'Адмирал';

        const joystick = { active: false, x: 0, y: 0, touchId: null, fire: false };
        let fireCooldown = 0;

        const _v1 = new THREE.Vector3();
        const _v2 = new THREE.Vector3();

        // ---------- INIT WORLD ----------
        function initWorld() {
            if (worldInitialized) return;
            worldInitialized = true;

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB);
            if (!isLowPower) scene.fog = new THREE.Fog(0x87CEEB, 200, 800);

            camera = new THREE.PerspectiveCamera(
                isMobile ? 70 : 60,
                window.innerWidth / window.innerHeight,
                0.5,
                isLowPower ? 1200 : 2500
            );
            camera.position.set(0, 30, 80);
            camera.lookAt(0, 0, 0);

            renderer = new THREE.WebGLRenderer({
                antialias: !isLowPower,
                powerPreference: 'high-performance',
                stencil: false
            });
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, isLowPower ? 1.5 : 2));
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = !isLowPower;
            if (renderer.shadowMap.enabled) renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.body.appendChild(renderer.domElement);

            labelRenderer = new CSS2DRenderer();
            labelRenderer.setSize(window.innerWidth, window.innerHeight);
            labelRenderer.domElement.style.position = 'absolute';
            labelRenderer.domElement.style.top = '0px';
            labelRenderer.domElement.style.left = '0px';
            labelRenderer.domElement.style.pointerEvents = 'none';
            document.body.appendChild(labelRenderer.domElement);

            scene.add(new THREE.AmbientLight(0x8899bb, 1.0));
            scene.add(new THREE.HemisphereLight(0x88bbff, 0x224466, 0.6));

            const sun = new THREE.DirectionalLight(0xffeedd, isLowPower ? 1.0 : 1.3);
            sun.position.set(120, 200, 80);
            if (!isLowPower) {
                sun.castShadow = true;
                sun.shadow.mapSize.width = 1024;
                sun.shadow.mapSize.height = 1024;
                const d = 250;
                sun.shadow.camera.left = -d;
                sun.shadow.camera.right = d;
                sun.shadow.camera.top = d;
                sun.shadow.camera.bottom = -d;
                sun.shadow.camera.near = 1;
                sun.shadow.camera.far = 600;
            }
            scene.add(sun);

            const segs = isLowPower ? 24 : 60;
            const oceanGeo = new THREE.PlaneGeometry(2000, 2000, segs, segs);
            const oceanMat = new THREE.MeshStandardMaterial({
                color: 0x1a5a8a,
                emissive: 0x0a1a2a,
                roughness: 0.35,
                metalness: 0.2,
                side: THREE.DoubleSide
            });
            ocean = new THREE.Mesh(oceanGeo, oceanMat);
            ocean.rotation.x = -Math.PI / 2;
            ocean.position.y = -1;
            if (!isLowPower) ocean.receiveShadow = true;
            scene.add(ocean);

            const skyGeo = new THREE.SphereGeometry(900, isLowPower ? 16 : 32, isLowPower ? 8 : 16);
            const skyMat = new THREE.MeshBasicMaterial({ color: 0x87CEEB, side: THREE.BackSide });
            sky = new THREE.Mesh(skyGeo, skyMat);
            scene.add(sky);

            window.addEventListener('resize', onWindowResize);
            window.addEventListener('orientationchange', () => setTimeout(onWindowResize, 200));
        }

        function onWindowResize() {
            if (!camera || !renderer) return;
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            labelRenderer.setSize(window.innerWidth, window.innerHeight);
        }

        // ---------- CREATE SHIP ----------
        function createShip(color, size = 1, type = 'player') {
            const group = new THREE.Group();

            const hullMat = new THREE.MeshLambertMaterial({ color: color });
            const hull = new THREE.Mesh(new THREE.BoxGeometry(5 * size, 1.6 * size, 12 * size), hullMat);
            hull.position.y = 0.8 * size;
            if (!isLowPower) { hull.castShadow = true; hull.receiveShadow = true; }
            group.add(hull);

            const bottomMat = new THREE.MeshLambertMaterial({ color: 0x332211 });
            const bottom = new THREE.Mesh(new THREE.BoxGeometry(4.5 * size, 1 * size, 11 * size), bottomMat);
            bottom.position.y = -0.2 * size;
            group.add(bottom);

            const superMat = new THREE.MeshLambertMaterial({ color: 0xe0e0e0 });
            const superstructure = new THREE.Mesh(
                new THREE.BoxGeometry(2.8 * size, 1.4 * size, 4 * size),
                superMat
            );
            superstructure.position.set(0, 2.0 * size, -0.5 * size);
            if (!isLowPower) superstructure.castShadow = true;
            group.add(superstructure);

            const bridge = new THREE.Mesh(
                new THREE.BoxGeometry(2 * size, 0.8 * size, 1.5 * size),
                new THREE.MeshLambertMaterial({ color: 0xffffff })
            );
            bridge.position.set(0, 3.0 * size, -1 * size);
            group.add(bridge);

            const funnel = new THREE.Mesh(
                new THREE.CylinderGeometry(0.6 * size, 0.7 * size, 1.5 * size, 8),
                new THREE.MeshLambertMaterial({ color: 0x222222 })
            );
            funnel.position.set(0, 3.0 * size, 1.0 * size);
            group.add(funnel);

            const turretMat = new THREE.MeshLambertMaterial({ color: 0x999999 });
            const turret1 = new THREE.Mesh(
                new THREE.CylinderGeometry(1.1 * size, 1.3 * size, 1.1 * size, 8),
                turretMat
            );
            turret1.position.set(0, 2.1 * size, 4 * size);
            if (!isLowPower) turret1.castShadow = true;
            group.add(turret1);

            const barrelMat = new THREE.MeshLambertMaterial({ color: 0x555555 });
            const barrel1 = new THREE.Mesh(
                new THREE.CylinderGeometry(0.18 * size, 0.18 * size, 3 * size, 6),
                barrelMat
            );
            barrel1.position.set(0, 2.1 * size, 5.5 * size);
            barrel1.rotation.x = Math.PI / 2;
            group.add(barrel1);

            const turret2 = new THREE.Mesh(
                new THREE.CylinderGeometry(1.0 * size, 1.2 * size, 1.0 * size, 8),
                turretMat
            );
            turret2.position.set(0, 2.0 * size, -4 * size);
            group.add(turret2);

            const barrel2 = new THREE.Mesh(
                new THREE.CylinderGeometry(0.18 * size, 0.18 * size, 3 * size, 6),
                barrelMat
            );
            barrel2.position.set(0, 2.0 * size, -5.5 * size);
            barrel2.rotation.x = Math.PI / 2;
            group.add(barrel2);

            // Метки
            let labelText, labelColor, labelBg;
            if (type === 'player') {
                labelText = '⚓ ' + currentUsername.toUpperCase();
                labelColor = '#ffd966';
                labelBg = 'rgba(120,80,0,0.7)';
            } else if (type === 'ally') {
                labelText = 'СОЮЗНИК';
                labelColor = '#88ff88';
                labelBg = 'rgba(0,80,0,0.7)';
            } else {
                labelText = 'ВРАГ';
                labelColor = '#ff8888';
                labelBg = 'rgba(120,0,0,0.7)';
            }

            const div = document.createElement('div');
            div.textContent = labelText;
            div.style.color = labelColor;
            div.style.fontWeight = 'bold';
            div.style.fontSize = isMobile ? '10px' : '12px';
            div.style.textShadow = '1px 1px 3px black';
            div.style.background = labelBg;
            div.style.padding = '2px 6px';
            div.style.borderRadius = '10px';
            div.style.whiteSpace = 'nowrap';
            div.style.border = '1px solid ' + labelColor;
            const label = new CSS2DObject(div);
            label.position.set(0, 7 * size, 0);
            group.add(label);

            return group;
        }

        // ---------- MAP OBJECTS ----------
        function addMapObjects(mapId) {
            const islandMat = new THREE.MeshLambertMaterial({ color: 0x3a6a3a });
            const islandMat2 = new THREE.MeshLambertMaterial({ color: 0x4a7a4a });
            const seg = isLowPower ? 8 : 12;

            const islands = [];
            if (mapId === 'north') {
                islands.push({ pos: [-70, 3, -60], r1: 15, r2: 22, h: 10, mat: islandMat });
                islands.push({ pos: [80, 2, -40], r1: 12, r2: 18, h: 8, mat: islandMat2 });
                islands.push({ pos: [0, 2, 90], r1: 10, r2: 14, h: 6, mat: islandMat2 });
            } else if (mapId === 'south') {
                islands.push({ pos: [60, 3, 70], r1: 18, r2: 24, h: 12, mat: islandMat });
                islands.push({ pos: [-80, 2, 50], r1: 12, r2: 16, h: 7, mat: islandMat2 });
                islands.push({ pos: [0, 2, -80], r1: 10, r2: 14, h: 6, mat: islandMat2 });
            } else if (mapId === 'east') {
                islands.push({ pos: [90, 4, 0], r1: 20, r2: 28, h: 14, mat: islandMat });
                islands.push({ pos: [50, 2, -80], r1: 14, r2: 20, h: 8, mat: islandMat2 });
                islands.push({ pos: [-60, 2, 60], r1: 11, r2: 15, h: 6, mat: islandMat2 });
            } else {
                islands.push({ pos: [-90, 3, 20], r1: 16, r2: 22, h: 10, mat: islandMat });
                islands.push({ pos: [-50, 4, -70], r1: 22, r2: 30, h: 15, mat: islandMat2 });
                islands.push({ pos: [70, 2, 40], r1: 11, r2: 15, h: 6, mat: islandMat2 });
            }

            islands.forEach(island => {
                const geo = new THREE.CylinderGeometry(island.r1, island.r2, island.h, seg);
                const mesh = new THREE.Mesh(geo, island.mat);
                mesh.position.set(island.pos[0], island.pos[1], island.pos[2]);
                mesh.userData.isMapObject = true;
                if (!isLowPower) { mesh.castShadow = true; mesh.receiveShadow = true; }
                scene.add(mesh);

                const topGeo = new THREE.CylinderGeometry(island.r1 * 0.6, island.r1 * 0.8, island.h * 0.4, seg);
                const topMesh = new THREE.Mesh(topGeo, islandMat);
                topMesh.position.set(island.pos[0], island.pos[1] + island.h * 0.6, island.pos[2]);
                topMesh.userData.isMapObject = true;
                scene.add(topMesh);
            });
        }

        // ---------- SPAWN ----------
        function spawnShips() {
            if (playerShip) scene.remove(playerShip);
            allies.forEach(s => scene.remove(s));
            enemies.forEach(s => scene.remove(s));
            bullets.forEach(b => { scene.remove(b); b.geometry.dispose(); b.material.dispose(); });
            enemyBullets.forEach(b => { scene.remove(b); b.geometry.dispose(); b.material.dispose(); });
            allies = []; enemies = []; bullets = []; enemyBullets = [];

            playerShip = createShip(0x3a8ad0, 1.2, 'player');
            playerShip.position.set(0, 0, 40);
            playerShip.userData = { type: 'player', health: 100 };
            scene.add(playerShip);

            const allyPositions = [{ x: -30, z: 50 }, { x: 30, z: 50 }];
            allyPositions.forEach(p => {
                const ally = createShip(0x3a8ad0, 1.0, 'ally');
                ally.position.set(p.x, 0, p.z);
                ally.userData = { type: 'ally', health: 100 };
                scene.add(ally);
                allies.push(ally);
            });

            const enemyPositions = [
                { x: -40, z: -50 },
                { x: 0, z: -60 },
                { x: 40, z: -50 }
            ];
            enemyPositions.forEach(p => {
                const enemy = createShip(0xd03a3a, 1.0, 'enemy');
                enemy.position.set(p.x, 0, p.z);
                enemy.rotation.y = Math.PI;
                enemy.userData = {
                    type: 'enemy',
                    health: HITS_TO_KILL,
                    maxHealth: HITS_TO_KILL,
                    cooldown: 1 + Math.random() * 1.5
                };
                scene.add(enemy);
                enemies.push(enemy);
            });
        }

        // ---------- OCEAN ----------
        function animateOcean(time) {
            if (!ocean || !ocean.geometry) return;
            const positions = ocean.geometry.attributes.position.array;
            for (let i = 0; i < positions.length; i += 3) {
                const x = positions[i];
                const y = positions[i + 1];
                positions[i + 2] = Math.sin(x * 0.04 + time * 1.5) * 1.0
                                 + Math.cos(y * 0.03 + time * 1.0) * 0.8;
            }
            ocean.geometry.attributes.position.needsUpdate = true;
            if (!isLowPower) ocean.geometry.computeVertexNormals();
        }

        // ---------- SHOOT ----------
        function shootFromShip(ship, shooterType) {
            if (!ship) return;
            const bulletGeo = new THREE.SphereGeometry(0.8, 5, 5);
            const isEnemy = shooterType === 'enemy';
            const bulletMat = new THREE.MeshBasicMaterial({
                color: isEnemy ? 0xff3300 : 0xffcc00
            });
            const bullet = new THREE.Mesh(bulletGeo, bulletMat);

            _v1.set(0, 2.5, 6).applyQuaternion(ship.quaternion);
            bullet.position.copy(ship.position).add(_v1);

            _v1.set(0, 0, 1).applyQuaternion(ship.quaternion);
            bullet.userData.velocity = _v1.clone().multiplyScalar(isEnemy ? 60 : 80);
            bullet.userData.life = 3;
            bullet.userData.isEnemy = isEnemy;

            scene.add(bullet);
            if (isEnemy) enemyBullets.push(bullet);
            else bullets.push(bullet);
        }

        // ---------- DESTROY SHIP ----------
        function destroyShip(ship) {
            const explosion = new THREE.Mesh(
                new THREE.SphereGeometry(6, 8, 8),
                new THREE.MeshBasicMaterial({ color: 0xff6600, transparent: true, opacity: 0.9 })
            );
            explosion.position.copy(ship.position);
            scene.add(explosion);

            let scale = 1;
            const growInterval = setInterval(() => {
                scale += 0.5;
                explosion.scale.set(scale, scale, scale);
                explosion.material.opacity -= 0.08;
                if (explosion.material.opacity <= 0) {
                    clearInterval(growInterval);
                    scene.remove(explosion);
                    explosion.geometry.dispose();
                    explosion.material.dispose();
                }
            }, 30);

            scene.remove(ship);
            ship.traverse(obj => {
                if (obj.geometry) obj.geometry.dispose();
                if (obj.material) {
                    if (Array.isArray(obj.material)) obj.material.forEach(m => m.dispose());
                    else obj.material.dispose();
                }
            });
        }

        // ---------- UPDATE ----------
        function updateGame(dt) {
            if (!gameActive || !playerShip) return;
            dt = Math.min(dt, 0.05);

            const speed = 25 * dt;
            const rotSpeed = 1.8 * dt;

            let moveForward = 0;
            if (keys.w) moveForward += 1;
            if (keys.s) moveForward -= 0.6;
            if (keys.a) playerShip.rotation.y += rotSpeed;
            if (keys.d) playerShip.rotation.y -= rotSpeed;

            if (joystick.active) {
                moveForward += -joystick.y;
                playerShip.rotation.y -= joystick.x * rotSpeed * 1.4;
            }

            if (Math.abs(moveForward) > 0.01) {
                playerShip.position.x += Math.sin(playerShip.rotation.y) * speed * moveForward;
                playerShip.position.z += Math.cos(playerShip.rotation.y) * speed * moveForward;
            }

            const L = 250;
            playerShip.position.x = Math.max(-L, Math.min(L, playerShip.position.x));
            playerShip.position.z = Math.max(-L, Math.min(L, playerShip.position.z));

            _v1.set(0, 28, -55).applyQuaternion(playerShip.quaternion);
            _v2.copy(playerShip.position).add(_v1);
            camera.position.lerp(_v2, 0.08);

            _v1.set(0, 5, 25).applyQuaternion(playerShip.quaternion);
            _v2.copy(playerShip.position).add(_v1);
            camera.lookAt(_v2);

            // Враги
            for (let i = enemies.length - 1; i >= 0; i--) {
                const e = enemies[i];
                _v1.subVectors(playerShip.position, e.position);
                const dist = _v1.length();
                if (dist > 25) {
                    _v1.normalize();
                    e.position.x += _v1.x * 0.15;
                    e.position.z += _v1.z * 0.15;
                }
                e.rotation.y = Math.atan2(
                    playerShip.position.x - e.position.x,
                    playerShip.position.z - e.position.z
                );

                e.userData.cooldown -= dt;
                if (e.userData.cooldown <= 0 && dist < 120) {
                    shootFromShip(e, 'enemy');
                    e.userData.cooldown = 1.5 + Math.random() * 1.5;
                }

                if (dist < 14) {
                    playerHealth -= 0.4;
                    if (playerHealth < 0) playerHealth = 0;
                    updateHUD();
                    _v2.subVectors(playerShip.position, e.position).normalize();
                    playerShip.position.x += _v2.x * 2;
                    playerShip.position.z += _v2.z * 2;
                }
            }

            // Союзники
            for (let i = 0; i < allies.length; i++) {
                const a = allies[i];
                const side = i === 0 ? -30 : 30;
                _v1.set(side, 0, 30).applyQuaternion(playerShip.quaternion);
                _v2.copy(playerShip.position).add(_v1);
                a.position.lerp(_v2, 0.04);
                a.rotation.y = playerShip.rotation.y;
            }

            // Пули игрока
            for (let i = bullets.length - 1; i >= 0; i--) {
                const b = bullets[i];
                b.position.addScaledVector(b.userData.velocity, dt);
                b.userData.life -= dt;

                let hit = false;
                for (let j = enemies.length - 1; j >= 0; j--) {
                    const enemy = enemies[j];
                    if (b.position.distanceTo(enemy.position) < 9) {
                        enemy.userData.health -= 1;
                        score += 10;
                        updateHUD();

                        const spark = new THREE.Mesh(
                            new THREE.SphereGeometry(2, 6, 6),
                            new THREE.MeshBasicMaterial({ color: 0xffaa00, transparent: true, opacity: 0.9 })
                        );
                        spark.position.copy(b.position);
                        scene.add(spark);
                        setTimeout(() => {
                            scene.remove(spark);
                            spark.geometry.dispose();
                            spark.material.dispose();
                        }, 200);

                        if (enemy.userData.health <= 0) {
                            destroyShip(enemy);
                            enemies.splice(j, 1);
                            score += 50;
                            updateHUD();
                        }
                        hit = true;
                        break;
                    }
                }
                if (hit || b.userData.life <= 0) {
                    scene.remove(b);
                    b.geometry.dispose();
                    b.material.dispose();
                    bullets.splice(i, 1);
                }
            }

            // Пули врагов
            for (let i = enemyBullets.length - 1; i >= 0; i--) {
                const b = enemyBullets[i];
                b.position.addScaledVector(b.userData.velocity, dt);
                b.userData.life -= dt;

                let hit = false;
                if (b.position.distanceTo(playerShip.position) < 10) {
                    playerHealth -= 10;
                    if (playerHealth < 0) playerHealth = 0;
                    updateHUD();
                    const spark = new THREE.Mesh(
                        new THREE.SphereGeometry(2.5, 6, 6),
                        new THREE.MeshBasicMaterial({ color: 0xff5500, transparent: true, opacity: 0.9 })
                    );
                    spark.position.copy(b.position);
                    scene.add(spark);
                    setTimeout(() => {
                        scene.remove(spark);
                        spark.geometry.dispose();
                        spark.material.dispose();
                    }, 200);
                    hit = true;
                }

                if (hit || b.userData.life <= 0) {
                    scene.remove(b);
                    b.geometry.dispose();
                    b.material.dispose();
                    enemyBullets.splice(i, 1);
                }
            }

            // Стрельба игрока
            fireCooldown -= dt;
            if ((keys.space || joystick.fire) && fireCooldown <= 0) {
                shootFromShip(playerShip, 'player');
                keys.space = false;
                joystick.fire = false;
                fireCooldown = 0.3;
            }

            // Победа
            if (enemies.length === 0 && !victoryShown && gameActive) {
                victoryShown = true;
                gameActive = false;
                setTimeout(showVictory, 400);
            }

            // Поражение
            if (playerHealth <= 0 && gameActive) {
                gameActive = false;
                setTimeout(() => {
                    alert('Корабль потоплен!');
                    location.reload();
                }, 200);
            }
        }

        // ---------- VICTORY ----------
        function showVictory() {
            document.getElementById('victoryScore').textContent = score;
            document.getElementById('victoryScreen').classList.add('show');
            document.getElementById('mobileControls').classList.remove('active');
            document.getElementById('ui-container').innerHTML = '';
        }

        function backToMapSelect() {
            document.getElementById('victoryScreen').classList.remove('show');
            document.getElementById('mapScreen').classList.remove('hidden');
            document.getElementById('authScreen').classList.add('hidden');

            if (playerShip) { scene.remove(playerShip); playerShip = null; }
            allies.forEach(s => scene.remove(s));
            enemies.forEach(s => scene.remove(s));
            bullets.forEach(b => { scene.remove(b); b.geometry.dispose(); b.material.dispose(); });
            enemyBullets.forEach(b => { scene.remove(b); b.geometry.dispose(); b.material.dispose(); });
            allies = []; enemies = []; bullets = []; enemyBullets = [];

            const toRemove = [];
            scene.traverse(obj => { if (obj.userData && obj.userData.isMapObject) toRemove.push(obj); });
            toRemove.forEach(o => scene.remove(o));

            victoryShown = false;
            gameActive = false;

            // Сброс выбора карты
            document.querySelectorAll('.map-card').forEach(c => c.classList.remove('selected'));
            const btn = document.getElementById('startBattleBtn');
            btn.disabled = true;
            document.getElementById('mapStatus').textContent = 'Выберите карту';
        }

        // ---------- HUD ----------
        function updateHUD() {
            const hud = document.getElementById('ui-container');
            if (!hud) return;
            const hint = isMobile ? 'Джойстик — движение | ОГОНЬ — выстрел'
                                  : 'W/S — ход | A/D — руль | ПРОБЕЛ — огонь';
            hud.innerHTML = `
                <div class="hud">
                    <div class="hud-left">
                        <div>❤️ ${Math.round(playerHealth)}%</div>
                        <div class="health-bar"><div class="health-fill" style="width:${playerHealth}%"></div></div>
                    </div>
                    <div class="hud-right">
                        <div>🎯 <span class="score">${score}</span></div>
                        <div style="font-size:11px;">💀 ${enemies.length} | ⚓ ${allies.length}</div>
                    </div>
                </div>
                <div class="controls-hint desktop-hint">${hint}</div>
            `;
        }

        // ---------- START GAME ----------
        function startGame(mapId) {
            if (!mapId) {
                alert('Сначала выберите карту!');
                return;
            }

            // Очистка сцены
            if (playerShip) { scene.remove(playerShip); playerShip = null; }
            allies.forEach(s => scene.remove(s));
            enemies.forEach(s => scene.remove(s));
            bullets.forEach(b => { scene.remove(b); b.geometry.dispose(); b.material.dispose(); });
            enemyBullets.forEach(b => { scene.remove(b); b.geometry.dispose(); b.material.dispose(); });
            allies = []; enemies = []; bullets = []; enemyBullets = [];

            const toRemove = [];
            scene.traverse(obj => { if (obj.userData && obj.userData.isMapObject) toRemove.push(obj); });
            toRemove.forEach(o => scene.remove(o));

            addMapObjects(mapId);
            spawnShips();

            playerHealth = 100;
            score = 0;
            gameActive = true;
            victoryShown = false;

            updateHUD();

            document.getElementById('authScreen').classList.add('hidden');
            document.getElementById('mapScreen').classList.add('hidden');
            document.getElementById('victoryScreen').classList.remove('show');

            if (isMobile) {
                document.getElementById('mobileControls').classList.add('active');
            }

            renderer.render(scene, camera);
            labelRenderer.render(scene, camera);
        }

        // ---------- MOBILE ----------
        function setupMobileControls() {
            const zone = document.getElementById('joystickZone');
            const knob = document.getElementById('joystickKnob');
            const fireBtn = document.getElementById('fireButton');
            const maxDist = 40;

            function updateJoy(touch) {
                const rect = zone.getBoundingClientRect();
                const cx = rect.left + rect.width / 2;
                const cy = rect.top + rect.height / 2;
                let dx = touch.clientX - cx;
                let dy = touch.clientY - cy;
                const d = Math.hypot(dx, dy);
                if (d > maxDist) { dx = dx / d * maxDist; dy = dy / d * maxDist; }
                knob.style.transform = `translate(${dx}px, ${dy}px)`;
                joystick.x = dx / maxDist;
                joystick.y = dy / maxDist;
            }

            zone.addEventListener('touchstart', e => {
                e.preventDefault();
                const t = e.changedTouches[0];
                joystick.touchId = t.identifier;
                joystick.active = true;
                updateJoy(t);
            }, { passive: false });

            zone.addEventListener('touchmove', e => {
                e.preventDefault();
                if (!joystick.active) return;
                for (const t of e.changedTouches) {
                    if (t.identifier === joystick.touchId) { updateJoy(t); break; }
                }
            }, { passive: false });

            function endJoy(e) {
                e.preventDefault();
                for (const t of e.changedTouches) {
                    if (t.identifier === joystick.touchId) {
                        joystick.active = false;
                        joystick.x = 0; joystick.y = 0;
                        joystick.touchId = null;
                        knob.style.transform = 'translate(0,0)';
                        break;
                    }
                }
            }
            zone.addEventListener('touchend', endJoy, { passive: false });
            zone.addEventListener('touchcancel', endJoy, { passive: false });

            fireBtn.addEventListener('touchstart', e => {
                e.preventDefault();
                joystick.fire = true;
            }, { passive: false });
            fireBtn.addEventListener('click', () => { joystick.fire = true; });
        }

        // ---------- BUILD MAP CARDS (ВАЖНО) ----------
        function buildMapCards() {
            const mapGrid = document.getElementById('mapGrid');
            mapGrid.innerHTML = ''; // очистим на всякий случай

            const maps = [
                { id: 'north', name: 'Север', desc: 'Ледяные воды' },
                { id: 'south', name: 'Юг', desc: 'Тёплое море' },
                { id: 'east', name: 'Восток', desc: 'Опасные рифы' },
                { id: 'west', name: 'Запад', desc: 'Туманные берега' }
            ];

            maps.forEach(m => {
                const card = document.createElement('div');
                card.className = 'map-card';
                card.dataset.mapId = m.id;
                card.innerHTML = `<h3>${m.name}</h3><p>${m.desc}</p>`;

                const selectHandler = (ev) => {
                    if (ev) ev.preventDefault();
                    console.log('🗺️ Выбрана карта:', m.id);
                    document.querySelectorAll('.map-card').forEach(c => c.classList.remove('selected'));
                    card.classList.add('selected');
                    selectedMapId = m.id;
                    currentMap = m.id;
                    const btn = document.getElementById('startBattleBtn');
                    btn.disabled = false;
                    btn.style.opacity = '1';
                    document.getElementById('mapStatus').textContent = 'Выбрано: ' + m.name;
                };

                card.addEventListener('click', selectHandler);
                card.addEventListener('touchend', selectHandler, { passive: false });
                mapGrid.appendChild(card);
            });
        }

        // ---------- EVENT LISTENERS ----------
        function setupEventListeners() {
            window.addEventListener('keydown', e => {
                switch (e.code) {
                    case 'KeyW': case 'ArrowUp': keys.w = true; e.preventDefault(); break;
                    case 'KeyA': case 'ArrowLeft': keys.a = true; e.preventDefault(); break;
                    case 'KeyS': case 'ArrowDown': keys.s = true; e.preventDefault(); break;
                    case 'KeyD': case 'ArrowRight': keys.d = true; e.preventDefault(); break;
                    case 'Space': keys.space = true; e.preventDefault(); break;
                }
            });
            window.addEventListener('keyup', e => {
                switch (e.code) {
                    case 'KeyW': case 'ArrowUp': keys.w = false; break;
                    case 'KeyA': case 'ArrowLeft': keys.a = false; break;
                    case 'KeyS': case 'ArrowDown': keys.s = false; break;
                    case 'KeyD': case 'ArrowRight': keys.d = false; break;
                }
            });

            // === ВХОД ===
            document.getElementById('loginBtn').addEventListener('click', () => {
                currentUsername = (document.getElementById('username').value.trim() || 'Адмирал').slice(0, 12);
                console.log('👤 Вход:', currentUsername);
                document.getElementById('authScreen').classList.add('hidden');
                document.getElementById('mapScreen').classList.remove('hidden');
                buildMapCards(); // строим карточки при входе
            });

            // Если пользователь нажал Enter в поле пароля
            document.getElementById('password').addEventListener('keydown', e => {
                if (e.key === 'Enter') {
                    document.getElementById('loginBtn').click();
                }
            });

            document.getElementById('registerBtn').addEventListener('click', () => {
                alert('Регистрация успешна! Теперь войдите.');
            });

            // === СТАРТ БОЯ ===
            document.getElementById('startBattleBtn').addEventListener('click', (e) => {
                e.preventDefault();
                if (!selectedMapId) {
                    alert('Выберите карту!');
                    return;
                }
                startGame(selectedMapId);
            });

            // === НАЗАД К КАРТАМ ===
            document.getElementById('backToMenuBtn').addEventListener('click', (e) => {
                e.preventDefault();
                backToMapSelect();
            });

            // Запрет скролла в игре
            document.addEventListener('touchmove', e => {
                if (gameActive) e.preventDefault();
            }, { passive: false });
        }

        // ---------- RENDER LOOP ----------
        let lastFrameTime = 0;
        let frameNum = 0;

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            const now = performance.now();

            if (isLowPower && now - lastFrameTime < 28) return;
            lastFrameTime = now;
            frameNum++;

            if (!isLowPower || frameNum % 2 === 0) {
                animateOcean(now / 1000);
            }

            if (gameActive) {
                updateGame(delta);
            } else if (playerShip) {
                _v1.set(0, 28, -55).applyQuaternion(playerShip.quaternion);
                _v2.copy(playerShip.position).add(_v1);
                camera.position.lerp(_v2, 0.05);
                camera.lookAt(playerShip.position);
            }

            renderer.render(scene, camera);
            labelRenderer.render(scene, camera);
        }

        // ---------- BOOT ----------
        window.addEventListener('load', () => {
            console.log('🔧 Инициализация...');
            initWorld();
            setupEventListeners();
            if (isMobile) setupMobileControls();
            animate();
            console.log('✅ Готово');
        });
    </script>
